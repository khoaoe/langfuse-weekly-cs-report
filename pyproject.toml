[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langfuse-weekly-cs-report"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.scripts]
weekly-cs-dashboard = "weekly_cs_report.web:main"
weekly-cs-report = "weekly_cs_report.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The SPA build emits hashed files into nested directories, so the patterns
# must be recursive: a flat `static/*` would ship an HTML shell whose script,
# style and font references are all missing from the wheel.
weekly_cs_report = [
  "static/*.html",
  "static/legacy/*.html",
  "static/spa/*",
  "static/spa/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
